# ZIM catalog for the Emergency Hub knowledge library.
#
# fetch-zims.sh reads this file, finds the newest dated build of each entry on
# download.kiwix.org, and downloads it to $ZIM_DIR. It also writes
# $ZIM_DIR/manifest.tsv so ingest_zim.py knows how to treat each file.
#
# Columns (whitespace separated):
#   folder  kiwix folder under https://download.kiwix.org/zim/
#   prefix  file name without the _YYYY-MM.zim suffix
#   tier    1 = core survival/medical, 2 = broad reference, 3 = optional/large
#   embed   full | selective | none  (none = kiwix-serve browsing only)
#   kind    html | pdf  (pdf = nautilus collection of PDFs inside the ZIM;
#           ingest_zim.py must extract the PDFs, H2/H3 chunking won't work)
#
# Lines starting with # are skipped. Sizes are approximate.
# Entries marked [HAS] came from github.com/schematrix/HAS_Prepper_Disk
# (content.conf, verified against download.kiwix.org in Oct 2026).

# --- Tier 1: medical -------------------------------------------------------
wikipedia       wikipedia_en_medicine_maxi          1  full       html  # WikiMed ~2 GB
other           wikem_en_all_maxi                   1  full       html  # emergency medicine ~260 MB
other           zimgit-medicine_en                  1  full       pdf   # medical books ~67 MB
zimit           fas-military-medicine_en            1  full       html  # [HAS] military field medicine ~78 MB
zimit           nhs.uk_en_medicines                 1  full       html  # [HAS] medicines A-Z ~15 MB
other           mdwiki_en_all_maxi                  1  none       html  # [HAS] ~2.1 GB; same WikiProjectMed source as WikiMed, browse only to avoid duplicate chunks

